<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini JSONPlaceholder</title>
    <link rel="stylesheet" href="stile.css" />
  </head>
  <body>
    <!-- ======================================================
         Header
         ====================================================== -->
    <header>
      <div class="contenitore">
        <h1><span class="emoji-kuromi">⚡</span> Mini JSONPlaceholder <span class="emoji-kuromi" style="animation-delay: 0.4s">🩸</span></h1>
        <p>Frontend per le nostre API REST</p>
      </div>
    </header>

    <div class="contenitore">
      <!-- ==================================================
             Navigazione
             ================================================== -->
      <nav>
        <button id="nav-utenti" class="attivo">Utenti</button>
        <button id="nav-post">Post</button>
        <button id="nav-commenti">Commenti</button>
        <button id="nav-login">Login</button>
        <button id="btn-logout" class="nascosta btn-pericolo">Logout</button>
      </nav>

      <p id="stato-login" class="stato-login">Non sei autenticato</p>

      <div id="statistiche"></div>

      <!-- ==================================================
             Sezione Login
             ================================================== -->
      <section id="sezione-login" class="nascosta">
        <h2>🔐 Login</h2>
        <form id="form-login">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" placeholder="mario@email.com" required />
          <label for="login-password">Password</label>
          <div class="input-password-wrap">
            <input type="password" id="login-password" placeholder="Almeno 8 caratteri" required />
            <button type="button" class="btn-mostra-password" data-target="login-password" title="Mostra/nascondi password">👁️</button>
          </div>
          <button type="submit">Accedi</button>
        </form>
      </section>

      <!-- ==================================================
             Sezione Utenti
             ================================================== -->
      <section id="sezione-utenti">
        <h2><span class="emoji-kuromi">🩸</span> Utenti</h2>

        <details class="accordion-utente">
          <summary class="accordion-header">＋ Nuovo Utente</summary>
          <form id="form-utente">
            <label for="utente-nome">Nome</label>
            <input
              type="text"
              id="utente-nome"
              placeholder="Es. Yoshi Verde"
              required
            />
            <label for="utente-email">Email</label>
            <input
              type="email"
              id="utente-email"
              placeholder="Es. yoshi@email.com"
              required
            />
            <label for="utente-citta">Citta (opzionale)</label>
            <input type="text" id="utente-citta" placeholder="Es. Isola Yoshi" />
            <label for="utente-cf">Codice Fiscale</label>
            <input
              type="text"
              id="utente-cf"
              placeholder="Es. RSSMRA90A01H501A"
              pattern="^[A-Za-z]{6}[0-9]{2}[A-Za-z][0-9]{2}[A-Za-z][0-9]{3}[A-Za-z]$"
              maxlength="16"
              required
            />
            <label for="utente-sesso">Sesso</label>
            <select id="utente-sesso" required>
              <option value="">-- Seleziona --</option>
              <option value="M">Maschio</option>
              <option value="F">Femmina</option>
              <option value="Altro">Altro</option>
            </select>
            <label for="utente-nascita">Data di Nascita (opzionale)</label>
            <input type="date" id="utente-nascita" />
            <label for="utente-telefono">Telefono (opzionale)</label>
            <input
              type="tel"
              id="utente-telefono"
              placeholder="Es. +39 06 1234567"
            />
            <label for="utente-password">Password</label>
            <div class="input-password-wrap">
              <input
                type="password"
                id="utente-password"
                placeholder="Almeno 8 caratteri"
                minlength="8"
                required
              />
              <button type="button" class="btn-mostra-password" data-target="utente-password" title="Mostra/nascondi password">👁️</button>
            </div>
            <label for="utente-avatar">Foto profilo (opzionale)</label>
            <input type="file" id="utente-avatar" accept="image/*" />
            <img id="preview-avatar" class="preview-avatar nascosta" alt="Anteprima" />
            <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
              <button type="submit" id="submit-utente">Crea Utente</button>
              <button type="button" id="annulla-modifica" class="nascosta">Annulla</button>
            </div>
          </form>
        </details>

        <input type="text" id="ricerca-utenti" placeholder="Cerca utenti..." />

        <div id="lista-utenti"></div>
      </section>

      <!-- ==================================================
             Sezione Post
             ================================================== -->
      <section id="sezione-post" class="nascosta">
        <div id="breadcrumb-post" class="breadcrumb"></div>
        <h2 id="titolo-post"><span class="emoji-kuromi" style="animation-delay:0.2s">⚡</span> Post</h2>

        <details class="accordion-utente">
          <summary class="accordion-header accordion-post">＋ Nuovo Post</summary>
          <form id="form-post">
            <label for="post-userId">User ID</label>
            <input type="number" id="post-userId" placeholder="Es. 1" required />
            <label for="post-titolo">Titolo</label>
            <input
              type="text"
              id="post-titolo"
              placeholder="Es. Il mio primo post"
              required
            />
            <label for="post-corpo">Corpo</label>
            <textarea
              id="post-corpo"
              placeholder="Scrivi il contenuto del post..."
              required
            ></textarea>
            <button type="submit">Crea Post</button>
          </form>
        </details>

        <div id="lista-post"></div>
      </section>

      <!-- ==================================================
             Sezione Commenti
             ================================================== -->
      <section id="sezione-commenti" class="nascosta">
        <div id="breadcrumb-commenti" class="breadcrumb"></div>
        <h2 id="titolo-commenti"><span class="emoji-kuromi" style="animation-delay:0.4s">👁️</span> Commenti</h2>

        <details class="accordion-utente">
          <summary class="accordion-header accordion-commento">＋ Nuovo Commento</summary>
          <form id="form-commento">
            <label for="commento-postId">Post ID</label>
            <input
              type="number"
              id="commento-postId"
              placeholder="Es. 1"
              required
            />
            <label for="commento-nome">Nome</label>
            <input
              type="text"
              id="commento-nome"
              placeholder="Es. Mario Rossi"
              required
            />
            <label for="commento-email">Email</label>
            <input
              type="email"
              id="commento-email"
              placeholder="Es. mario@email.com"
              required
            />
            <label for="commento-corpo">Corpo</label>
            <textarea
              id="commento-corpo"
              placeholder="Scrivi il commento..."
              required
            ></textarea>
            <button type="submit">Crea Commento</button>
          </form>
        </details>

        <div id="lista-commenti"></div>
      </section>
    </div>

    <!-- Modal conferma elimina -->
    <div id="modal-conferma" class="modal-overlay nascosta">
      <div class="modal-box">
        <p id="modal-testo">Sei sicuro?</p>
        <div class="modal-azioni">
          <button id="modal-btn-conferma" class="btn-pericolo">Elimina</button>
          <button id="modal-btn-annulla" class="btn-secondario">Annulla</button>
        </div>
      </div>
    </div>

    <script type="module" src="js/app.js"></script>
    <script src="js/cursor.js"></script>
    <script src="js/tema-switcher.js"></script>
  </body>
</html>
